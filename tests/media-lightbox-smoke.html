<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Azaman media smoke</title></head>
<body>
<pre id="result">running</pre>
<iframe id="app" title="Azaman simulator" style="width:100%;height:700px;border:0"></iframe>
<script>
(() => {
  const KEY = 'azaman-sat-practice-v3';
  const out = document.getElementById('result');
  const frame = document.getElementById('app');
  const now = Date.now();
  localStorage.setItem(KEY, JSON.stringify({
    v: 3, screen: 'test', student: 'Media Smoke', accessCode: 'SAT26', roomCode: 'AZM24', startCode: '492776',
    mi: 0, qi: 19, endAt: now + 1200000, breakEndAt: null,
    answers: {}, marked: {}, eliminated: {}, notes: {}, highlights: {},
    completed: {}, submitted: false, adaptive: { rw: 'hard', math: 'easy' }, timerHidden: false, lineReader: false,
    rules: true, desk: true, warning: {}
  }));
  frame.src = '../index.html?media-smoke=' + now;
  frame.addEventListener('load', () => setTimeout(() => {
    const doc = frame.contentDocument;
    const checks = [];
    const check = (name, value) => { checks.push(`${value ? 'PASS' : 'FAIL'} ${name}`); if (!value) throw new Error(name); };
    try {
      check('question image renders', !!doc.querySelector('.azm-media-image'));
      check('image has descriptive alt', (doc.querySelector('.azm-media-image')?.alt || '').length > 30);
      check('image has original practice caption', /original practice/i.test(doc.querySelector('.azm-media figcaption')?.textContent || ''));
      doc.querySelector('.azm-media-trigger').click();
      check('lightbox opens', !!doc.getElementById('azmMediaLightbox'));
      check('lightbox image preserves alt text', doc.querySelector('.azm-media-lightbox-image')?.alt === doc.querySelector('.azm-media-image')?.alt);
      const zoom = doc.querySelector('.azm-media-zoom');
      check('starts at 100%', zoom?.textContent === '100%');
      doc.querySelector('[data-media-action="zoom-in"]').click();
      check('zoom-in changes scale', zoom?.textContent === '125%');
      check('zoomed viewport enables panning', doc.querySelector('.azm-media-viewport')?.classList.contains('panning'));
      const viewport = doc.querySelector('.azm-media-viewport');
      const image = doc.querySelector('.azm-media-lightbox-image');
      viewport.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, pointerId: 1, clientX: 200, clientY: 200 }));
      viewport.dispatchEvent(new PointerEvent('pointermove', { bubbles: true, pointerId: 1, clientX: 240, clientY: 225 }));
      viewport.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, pointerId: 1, clientX: 240, clientY: 225 }));
      check('pan updates image transform', Number.isFinite(doc.getElementById('azmMediaLightbox')?.__azmMediaState?.x) && Number.isFinite(doc.getElementById('azmMediaLightbox')?.__azmMediaState?.y));
      doc.getElementById('azmMediaLightbox').__azmMediaState.x = 9999;
      doc.getElementById('azmMediaLightbox').__azmMediaState.y = 9999;
      const bounded = doc.getElementById('azmMediaLightbox').__azmMediaState;
      check('panning is bounded', Math.abs(bounded.x) < 1000 && Math.abs(bounded.y) < 1000);
      doc.querySelector('[data-media-action="reset"]').click();
      check('reset returns to 100%', zoom?.textContent === '100%' && image?.style.transform === 'translate(0px, 0px) scale(1)');
      // Touch handlers are attached by a MutationObserver, so the pinch must run in a later task.
      setTimeout(() => {
        try {
          viewport.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, pointerId: 11, clientX: 100, clientY: 200 }));
          viewport.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, pointerId: 12, clientX: 200, clientY: 200 }));
          viewport.dispatchEvent(new PointerEvent('pointermove', { bubbles: true, pointerId: 12, clientX: 300, clientY: 200, cancelable: true }));
          viewport.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, pointerId: 12, clientX: 300, clientY: 200 }));
          viewport.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, pointerId: 11, clientX: 100, clientY: 200 }));
          check('two-finger pinch changes zoom', Number.parseFloat(zoom?.textContent || '0') >= 190);
          doc.querySelector('[data-media-action="reset"]').click();
          doc.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));
          check('Escape closes lightbox', !doc.getElementById('azmMediaLightbox'));
          check('page scroll lock released', !doc.body.classList.contains('azm-media-open'));
          check('trigger focus restored', doc.activeElement?.classList.contains('azm-media-trigger'));
          const runtime = frame.contentWindow.AZAMAN_APP;
          const live = runtime.getState();
          live.mi = 2;
          live.qi = 6;
          live.screen = 'test';
          live.endAt = Date.now() + 1200000;
          runtime.save();
          runtime.render();
          setTimeout(() => {
            try {
              const mathImage = frame.contentDocument.querySelector('.azm-media-image');
              check('math geometry image renders', !!mathImage);
              check('math image has descriptive alt', /triangle/i.test(mathImage?.alt || '') && (mathImage?.alt || '').length > 25);
              check('math image uses original fixture', /triangle-area\.svg$/i.test(mathImage?.getAttribute('src') || ''));
              out.textContent = checks.join('\n') + '\nMEDIA LIGHTBOX SMOKE COMPLETE';
            } catch (error) {
              out.textContent = checks.join('\n') + '\nFAIL ' + error.message;
            }
          }, 175);
          out.textContent = checks.join('\n') + '\nMEDIA LIGHTBOX SMOKE COMPLETE';
        } catch (error) {
          out.textContent = checks.join('\n') + `\nFAIL ${error.message}`;
        }
      }, 150);
    } catch (error) {
      out.textContent = checks.join('\n') + `\nFAIL ${error.message}`;
    }
  }, 250));
})();
</script>
</body>
</html>
