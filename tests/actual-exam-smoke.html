<!doctype html><meta charset="utf-8"><title>Actual exam smoke</title><pre id="result">boot</pre><iframe id="app" title="Azaman simulator" style="width:100%;height:800px;border:0"></iframe><script>
(()=>{const K='azaman-sat-practice-v3',out=document.getElementById('result'),frame=document.getElementById('app'),checks=[];let phase=0,done=false;const check=(n,x)=>{checks.push((x?'PASS ':'FAIL ')+n);if(!x)throw Error(n)};const now=()=>Date.now();const base=()=>({v:3,screen:'test',student:'Actual Smoke Student',email:'actual@example.com',password:'',accessCode:'SAT26',roomCode:'AZM24',startCode:'492776',step:10,setupStep:1,setupDone:true,infoCorrect:'yes',deviceOk:'yes',infoOk:true,rulesOk:true,checkinRules:true,aids:{},pledge:'',roomOk:true,mi:0,qi:0,endAt:now()+600000,breakEndAt:null,answers:{},marked:{},eliminated:{},notes:{},highlights:{},completed:{},submitted:false,adaptive:{rw:'easy',math:'easy'},timerHidden:false,lineReader:false,rules:true,desk:true,warning:{},harness:false});const read=()=>JSON.parse(frame.contentWindow.localStorage.getItem(K)||'null');const writeRender=s=>{const app=frame.contentWindow.AZAMAN_APP;if(typeof app?.getState!=='function'||typeof app?.save!=='function'||typeof app?.render!=='function')throw Error('AZAMAN_APP state API unavailable');const live=app.getState();Object.keys(live).forEach(k=>delete live[k]);Object.assign(live,s);app.save();app.render()};const finalize=t=>{if(done)return;done=true;out.textContent=t;try{frame.remove()}catch(_){} };const fail=e=>finalize(checks.join('\n')+'\nFAIL '+(e?.message||e));const waitFor=(sel,ms=6000)=>new Promise((res,rej)=>{const end=Date.now()+ms;(function poll(){if(done)return;if(frame.contentDocument?.querySelector(sel))return res(frame.contentDocument);if(Date.now()>end)return rej(Error('timeout '+sel+' body='+(frame.contentDocument?.body?.textContent||'').slice(0,300)));setTimeout(poll,50)})()});
frame.addEventListener('error',e=>fail(e));frame.addEventListener('load',()=>{if(done||phase!==0)return;try{check('production API available',typeof frame.contentWindow.AZAMAN_APP?.render==='function');phase=1;writeRender({...base(),screen:'checkin',step:8,endAt:null});waitFor('#azmStartCodePage').then(runPhase).catch(fail)}catch(e){fail(e)}});
function runPhase(){if(done)return;try{const d=frame.contentDocument;if(phase===1){check('start code surface renders',!!d.getElementById('azmStartCodePage'));check('numbers-only instruction',/numbers only/i.test(d.body.textContent));check('six input boxes',d.querySelectorAll('.azm-start-digit').length===6);check('start test control',!!d.getElementById('azmStartTest'));check('battery indicator',!!d.getElementById('azmBatteryStatus'));d.querySelectorAll('.azm-start-digit').forEach((x,i)=>{x.value=base().startCode[i];x.dispatchEvent(new Event('input',{bubbles:true}))});d.getElementById('azmStartTest').click();waitFor('#azmDirectionsPage').then(()=>{check('start enters directions',read().screen==='directions'&&read().mi===0);phase=2;writeRender({...base(),screen:'signin',mi:2,qi:7,endAt:now()+241000,recovery:{remainingMs:241000,expiresAt:now()+600000},answers:{'rw1-0':'A'}});return waitFor('#azmRecoveryNotice')}).then(runPhase).catch(fail);return}
if(phase===2){check('recovery notice',!!d.getElementById('azmRecoveryNotice'));d.getElementById('email').value=base().email;d.getElementById('email').dispatchEvent(new Event('input',{bubbles:true}));d.getElementById('password').value='resume';d.getElementById('password').dispatchEvent(new Event('input',{bubbles:true}));d.getElementById('signinBtn').click();waitFor('.test-shell').then(()=>{const s=read();check('recovery resumes test',s.screen==='test'&&s.mi===2&&s.qi===7);check('recovery clears',!s.recovery);check('deadline restored',s.endAt>now()+230000);check('answers survive',s.answers['rw1-0']==='A');phase=3;writeRender({...base(),screen:'test',mi:0,qi:26,endAt:now()+240000});return waitFor('.test-shell')}).then(runPhase).catch(fail);return}
if(phase===3){check('preview banner hidden',getComputedStyle(d.querySelector('.preview-banner')).display==='none');d.getElementById('nextBtn').click();waitFor('#azmExamGate').then(()=>{const s=read();check('early advance blocked',s.mi===0&&s.qi===26&&s.screen==='test');check('gate appears',!!d.getElementById('azmExamGate'));check('review modal absent',!d.getElementById('reviewModal'));phase=4;writeRender({...base(),screen:'break',mi:2,breakEndAt:now()+3000,completed:{rw1:true,rw2:true,math1:false,math2:false}});return waitFor('#azmBreakPage')}).then(runPhase).catch(fail);return}
if(phase===4){check('break surface',!!d.getElementById('azmBreakPage'));check('break rules',/Follow these rules during the break/i.test(d.getElementById('azmBreakPage').textContent));check('resume hidden during break',!d.getElementById('azmResumeBtn'));waitFor('#azmResumeBtn',6000).then(()=>{check('resume appears after break timer',!!frame.contentDocument?.getElementById('azmResumeBtn'));frame.contentDocument.getElementById('azmResumeBtn').click();return waitFor('#azmDirectionsPage')}).then(()=>{const s=read();check('resume enters math directions',s.screen==='directions'&&s.mi===2&&!s.breakEndAt);phase=5;writeRender({...base(),screen:'finish',mi:3,completed:{rw1:true,rw2:true,math1:true,math2:true},submitted:true});return waitFor('#azmSubmissionScreen')}).then(runPhase).catch(fail);return}
if(phase===5){check('submission surface',!!d.getElementById('azmSubmissionScreen'));check('congratulations',d.querySelector('.azm-congrats-card h1')?.textContent==='Congratulations!');check('completion copy',/test is complete, and your answers have been submitted/i.test(d.querySelector('.azm-congrats-sub')?.textContent||''));check('proctor instruction',/proctor/i.test(d.querySelector('.azm-congrats-copy')?.textContent||''));finalize(checks.join('\n')+'\nACTUAL EXAM SMOKE COMPLETE')}}catch(e){fail(e)}}
frame.src='../index.html?browser-smoke=1';
})()
</script>
